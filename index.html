<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8B0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FestaGest Pro">
    <meta name="description" content="Gestão de barraquinhas, trailers e lanchonetes para festas e eventos">
    <title>FestaGest Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">🍔</div>
            <h1 class="splash-title">FestaGest Pro</h1>
            <div class="splash-loader">
                <div class="loader-bar"></div>
            </div>
            <p class="splash-subtitle">Carregando...</p>
        </div>
    </div>

    <!-- App Container -->
    <div id="appContainer" class="app-container" style="display:none;">
        <!-- Header -->
        <header class="app-header" id="appHeader">
            <div class="header-left">
                <button class="icon-btn" id="menuToggle" aria-label="Menu lateral" title="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="header-center">
                <h1 class="header-title" id="headerTitle">Dashboard</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Sidebar Menu (drawer) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="sidebar-header">
                    <div class="sidebar-logo">🍔</div>
                    <h2 class="sidebar-brand">FestaGest Pro</h2>
                </div>
                <ul class="sidebar-menu" id="sidebarMenu">
                    <!-- Preenchido dinamicamente -->
                </ul>
                <div class="sidebar-footer">
                    <p class="version-text">v1.0.0</p>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Renderizado dinamicamente -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-page="dashboard" aria-label="Dashboard">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span>Dashboard</span>
            </button>
            <button class="nav-item" data-page="vendas" aria-label="Modo Festa">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Festa</span>
            </button>
            <button class="nav-item" data-page="estoque" aria-label="Estoque">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                <span>Estoque</span>
            </button>
            <button class="nav-item" data-page="receitas" aria-label="Receitas">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
                <span>Receitas</span>
            </button>
            <button class="nav-item" data-page="mais" aria-label="Mais">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
                </svg>
                <span>Mais</span>
            </button>
        </nav>

        <!-- Modal Container -->
        <div class="modal-overlay" id="modalOverlay" style="display:none;">
            <div class="modal-content" id="modalContent">
                <!-- Renderizado dinamicamente -->
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast-container" id="toastContainer"></div>

        <!-- Fab Button (contextual) -->
        <button class="fab" id="fabButton" aria-label="Adicionar" title="Adicionar" style="display:none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
